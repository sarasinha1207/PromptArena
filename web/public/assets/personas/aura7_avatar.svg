<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9fbf7"/>
      <stop offset="1" stop-color="#6f9f99"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ece6"/>
      <stop offset="1" stop-color="#4f7f79"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fcfc7"/>
    </linearGradient>
    <linearGradient id="slit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee6c4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9ffbe8"/>
      <stop offset="1" stop-color="#3ee6c4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- orbit rings -->
  <circle cx="160" cy="170" r="140" stroke="#3ee6c4" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 10"/>
  <circle cx="160" cy="170" r="116" stroke="#3ee6c4" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="276" cy="170" r="7" fill="#3ee6c4"/>
  <circle cx="44" cy="170" r="5" fill="#9ffbe8"/>

  <!-- hull shoulders -->
  <path d="M4 400C4 334 58 298 160 298s156 36 156 102Z" fill="url(#hull)"/>
  <path d="M40 400 68 336M280 400 252 336" stroke="#4f7f79" stroke-width="3" stroke-linecap="round"/>
  <path d="M96 304 120 400M224 304 200 400" stroke="#4f7f79" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 330q50-22 100-22t100 22" stroke="#4f7f79" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>

  <!-- reactor core -->
  <circle cx="160" cy="354" r="30" fill="#0b2a2a"/>
  <circle cx="160" cy="354" r="30" stroke="#3ee6c4" stroke-width="4"/>
  <circle cx="160" cy="354" r="14" fill="#9ffbe8"/>
  <circle cx="160" cy="354" r="22" stroke="#3ee6c4" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 6"/>

  <!-- neck rings -->
  <rect x="136" y="262" width="48" height="44" rx="10" fill="url(#plate)"/>
  <path d="M138 276h44M138 288h44" stroke="#3a615c" stroke-width="3"/>

  <!-- head fin -->
  <path d="M160 40 182 92H138Z" fill="url(#plate)"/>
  <path d="M160 52v34" stroke="#3ee6c4" stroke-width="3" stroke-linecap="round"/>

  <!-- head -->
  <path d="M82 190C82 118 116 84 160 84s78 34 78 106c0 52-22 84-78 84S82 242 82 190Z" fill="url(#head)"/>
  <path d="M82 190C82 118 116 84 160 84s78 34 78 106c0 52-22 84-78 84S82 242 82 190Z" stroke="#7fb8ae" stroke-width="2"/>
  <path d="M96 150q22-48 64-52" stroke="#fff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>

  <!-- visor slit -->
  <rect x="96" y="168" width="128" height="40" rx="20" fill="#0a2523"/>
  <rect x="104" y="184" width="112" height="8" rx="4" fill="url(#slit)" filter="url(#glow)"/>
  <rect x="104" y="185" width="112" height="6" rx="3" fill="url(#slit)"/>
  <circle cx="160" cy="188" r="9" fill="#9ffbe8"/>
  <circle cx="160" cy="188" r="4" fill="#0a2523"/>

  <!-- ear modules -->
  <rect x="68" y="174" width="18" height="44" rx="9" fill="url(#plate)"/>
  <rect x="234" y="174" width="18" height="44" rx="9" fill="url(#plate)"/>
  <circle cx="77" cy="196" r="3" fill="#3ee6c4"/><circle cx="243" cy="196" r="3" fill="#3ee6c4"/>
</svg>
